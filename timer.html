
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت الدراسة | Study Planner</title>
    <link rel="stylesheet" href="timer.css">
</head>

<body>

    <aside class="sidebar">
        <h2>Study Planner</h2>

        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="schedule.html">📅 الجدول الدراسي</a>
        <a href="tasks.html">📝 المهام</a>
        <a href="exams.html">📚 الامتحانات</a>
        <a href="timer.html" class="active">⏱️ مؤقت الدراسة</a>
        <a href="achievements.html" class="nav-link" id="navAchievements">🏆 إنجازاتي</a>
        <a href="profile.html" class="nav-link" id="navProfile">👤 الملف الشخصي</a>
        <a href="settings.html" class="nav-link" id="navSettings">⚙️ الإعدادات</a>
        <a href="index.html">🚪 تسجيل الخروج</a>
    </aside>

    <main class="content">

        <header>
            <h1>مؤقت الدراسة</h1>
            <p>ركّزي في دراستك وخذي استراحة بوقتها</p>
        </header>

        <section class="timer-section">

            <div class="timer-modes">
                <button class="mode active" data-time="1500">وقت الدراسة</button>
                <button class="mode" data-time="300">استراحة قصيرة</button>
                <button class="mode" data-time="900">استراحة طويلة</button>
            </div>

            <div class="timer-circle">

                <svg class="progress-ring" width="280" height="280">
                    <circle class="background-circle"
                        cx="140" cy="140" r="125"></circle>

                    <circle class="progress-circle"
                        cx="140" cy="140" r="125"></circle>
                </svg>

                <div class="timer-display">
                    <h2 id="timer">25:00</h2>
                    <p id="timerLabel">وقت الدراسة</p>
                </div>

            </div>

            <div class="timer-buttons">
                <button id="startBtn">ابدئي</button>
                <button id="resetBtn">إعادة ضبط</button>
            </div>

            <div class="sessions">
                <h3>الجلسات المكتملة</h3>
                <p id="sessionsCount">0</p>
            </div>

            <p class="motivation">
                كل دقيقة دراسة تقرّبك من هدفك 🌷
            </p>

        </section>

    </main>

    <script src="timer.js"></script>

</body>
</html>
